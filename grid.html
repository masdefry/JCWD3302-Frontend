<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Grid</title>
    <link
      rel="stylesheet"
      href="grid.css"
    />
  </head>
  <body>
    <!-- 
        GRID
        1. Container (Parent) & Item (Child)
        2. grid-template-cols (menentukan jumlah kolom)
           grid-template-rows (menentukan jumlah baris)
           grid-gap (memberikan jarak antar element item/child)
    -->
    <div id="container">
      <div>Card-01</div>
      <div>Card-02</div>
      <div>Card-02</div>
    </div>

    <div id="container-01">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div>04</div>
        <div>05</div>
    </div>
  </body>
</html>
