<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Flexbox</title>
    <link
      rel="stylesheet"
      href="flexbox.css"
    />
  </head>
  <body>
    <!-- 
        FLEXBOX:
        1. Container (Parent) & Item (Child)
        2. justify-content (mengatur secara sumbu-x), 
           align-items (mengatur secara sumbu-y), 
           gap (memberikan jarak antar element item)
        3. justify-content ataupu align-items: start, center, end, space-around, space-between
    -->
    <div id="container">
      <div>Card-01</div>
      <div>Card-02</div>
      <div>Card-03</div>
    </div>
  </body>
</html>
